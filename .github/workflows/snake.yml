name: Generate Panda Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Contribution Grid Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=orange
        env:
          # এখানে পান্ডা বা ইমোজি কাস্টমাইজ করার অপশন থাকে
          # অথবা আপনি সরাসরি Platane/snk এর প্যারামিটার ব্যবহার করতে পারেন
